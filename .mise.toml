# =============================================================================
# rtunk Development Environment Configuration
# =============================================================================
# This mise configuration provides the complete toolchain needed to build,
# lint, test and release rtunk, and defines the tasks shared by local
# development and CI (.github/workflows/*). CI never calls the tools directly:
# it runs `mise run ci:<task>`, so a green local `mise run ci` is the same gate
# a pull request goes through.
#
# Usage:
#   mise install     # Install all tools
#   mise trust       # Trust this configuration (if prompted)
#   mise tasks       # List the available tasks
#   mise run ci      # Run the whole CI quality gate (commit messages excluded)
#
# Tool versions are resolved into mise.lock (`mise lock`); CI installs with
# `--locked`, so a version only changes through a reviewed lockfile update.
# =============================================================================

# =============================================================================
# Tool Installation Matrix
# =============================================================================
# Tools are organized by functional category. All tools default to "latest"
# version unless stability requires pinning.

[tools]
# -----------------------------------------------------------------------------
# Go Toolchain
# -----------------------------------------------------------------------------
# Compiler and Go-specific tooling used to build, analyze and scan rtunk

go = "latest"                                     # rtunk is implemented in Go (see AGENTS.md)
"go:golang.org/x/tools/gopls" = "latest"          # Go language server, used by editors/agents (Serena)
"go:golang.org/x/vuln/cmd/govulncheck" = "latest" # Known-CVE scan of Go dependencies (`security:audit`)

# -----------------------------------------------------------------------------
# Lint and Convention Tools
# -----------------------------------------------------------------------------
# Tools enforcing the repository conventions

"github:axnic/rtunk" = "latest"                              # rtunk lints itself with its own release (`lint`), never a local build
node = "lts"                                                   # Runtime for commitlint
"npm:@commitlint/cli" = "latest"                               # Commit convention check, drives .commitlintrc.js (`ci:commitlint`)

# -----------------------------------------------------------------------------
# Release Tools
# -----------------------------------------------------------------------------
# Tools used by the release workflow only (.github/workflows/*release*)

goreleaser = "latest" # Cross-platform release builds, drives .goreleaser.yml
cosign = "latest"     # Keyless signing of release checksums (goreleaser `signs`)
syft = "latest"       # SBOM generation for release archives (goreleaser `sboms`)

# =============================================================================
# Tasks
# =============================================================================
# `ci:*` tasks are the units the CI workflows run, one per job. Each is also
# the exact command to run locally; `ci` chains them as the quality gate.

# -----------------------------------------------------------------------------
# Quality Gate
# -----------------------------------------------------------------------------
# Repository-specific checks (rtunk covers the generic linters through `lint`)

[tasks.lint]
description = "Run rtunk's own lint stack (.rtunk/rtunk.yaml, golangci-lint included) on every file"
run = "rtunk check ."

[tasks."lint:fix"]
description = "Run rtunk's lint stack on every file and apply the available fixes"
run = "rtunk check --fix ."

[tasks."ci:lint"]
description = "Check that action.yml can be published to the GitHub Marketplace (a name, and a description of at most 125 characters)"
run = '''
name=$(sed -n 's/^name: *//p' action.yml)
desc=$(sed -n 's/^description: *//p' action.yml)
[ -n "$name" ] || { echo "action.yml: no single-line name"; exit 1; }
[ -n "$desc" ] || { echo "action.yml: no single-line description"; exit 1; }
case "$desc" in ">"*|"|"*) echo "action.yml: write the description on a single line, a folded one cannot be checked"; exit 1 ;; esac
# wc -c rather than the shell length expansion: mise treats a brace followed by a hash in a task
# script as the start of a template comment.
len=$(printf '%s' "$desc" | wc -c)
[ "$len" -le 125 ] || { echo "action.yml: the description has $len characters, the Marketplace allows at most 125"; exit 1; }
'''

[tasks."ci:commitlint"]
description = "Validate commit messages in a range (usage: mise run ci:commitlint -- --from <sha> --to <sha>)"
run = "commitlint --verbose"

[tasks."security:audit"]
description = "Scan Go dependencies for known vulnerabilities"
run = "govulncheck ./..."

# -----------------------------------------------------------------------------
# Build and Test
# -----------------------------------------------------------------------------
# Compilation and unit tests; only needed when Go code (or what feeds it) changes

[tasks."ci:build"]
description = "Build the rtunk binary"
run = "go build -o rtunk ./cmd/rtunk"

[tasks."ci:test"]
description = "Run the unit tests with the race detector and a coverage profile"
run = "go test -race -covermode=atomic -coverprofile=coverage.txt ./..."

# A floor, not a target: it catches coverage regressions without pinning today's exact number.
# Raise it as coverage improves; never lower it to make a failing PR pass.
[tasks."ci:coverage"]
description = "Fail if total statement coverage is below the floor (default 80%)"
depends = ["ci:test"]
env = { COVERAGE_FLOOR = "80" }
run = '''
total=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}' | tr -d '%')
echo "Total statement coverage: ${total}%"
awk -v total="$total" -v floor="$COVERAGE_FLOOR" 'BEGIN { if (total + 0 < floor + 0) { print "coverage " total "% is below the " floor "% floor"; exit 1 } }'
'''

# -----------------------------------------------------------------------------
# Aggregate
# -----------------------------------------------------------------------------

[tasks.ci]
description = "Local gate run before a release (lint, commit messages and dependency audit excluded)"
depends = ["ci:lint", "ci:build", "ci:coverage"]
