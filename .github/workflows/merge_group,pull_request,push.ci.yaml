# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# CI — Pull-request, merge-queue & main quality gate
# =============================================================================
# Validates every PR (and merge-queue entry) before it lands on main, and every
# direct push to main - rtunk takes commits directly on main without a PR, so
# the push trigger is what actually validates them (merge_group/pull_request
# never fire for a direct push):
#
#   lint        — golangci-lint (drives .golangci.yml)
#   commitlint  — rtunk commit convention on every commit in the PR (or, on a
#                 direct push, every commit introduced by that push). Skipped
#                 for Dependabot PRs: its own commit messages never follow the
#                 `type[scope]: Subject` convention; the dependabot-auto-merge
#                 workflow sets a compliant subject at squash-merge time, and
#                 the push step below re-validates that squashed commit.
#   build       — rtunk binary
#   test        — unit tests with the race detector + a coverage floor
#
# Every job calls a task defined in .mise.toml, so `mise run ci` locally is the
# same gate (minus commit messages).
# =============================================================================

name: PR, Merge-Queue & Main Quality Gate

on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # lint — golangci-lint
  # ---------------------------------------------------------------------------
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs only the tools this job needs from .mise.toml.
      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: go golangci-lint

      - name: 🔍 Run golangci-lint
        run: mise run lint

  # ---------------------------------------------------------------------------
  # commitlint — every commit must follow the rtunk commit convention
  # ---------------------------------------------------------------------------
  commitlint:
    name: ✉️ Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history is needed to compare base..head SHA range.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: node npm:@commitlint/cli

      - name: ✅ Validate commit messages
        if: github.event_name != 'push' && github.actor != 'dependabot[bot]'
        run: |
          mise run commitlint -- \
            --from ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }} \
            --to   ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: ✅ Validate commit messages (push to main)
        if: github.event_name == 'push'
        run: |
          mise run commitlint -- \
            --from ${{ github.event.before }} \
            --to   ${{ github.event.after }}

  # ---------------------------------------------------------------------------
  # build — rtunk binary
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: go

      - name: 🏗️ Build rtunk
        run: mise run build

  # ---------------------------------------------------------------------------
  # test — unit tests (race detector) + minimum coverage floor
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: go

      - name: 🧪 Run tests and enforce minimum coverage
        run: mise run coverage
