# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# CI — Pull-request, merge-queue & main quality gate
# =============================================================================
# Validates every PR (and merge-queue entry) before it lands on main, and every
# push to main (main only accepts merged PRs, so a push is the merge commit):
#
#   lint        — golangci-lint (drives .golangci.yml)
#   rtunk       — rtunk's own lint stack (.rtunk/rtunk.yaml) through the repository's
#                 GitHub Action (action.yml), built from the checkout: rtunk dogfoods itself
#                 and the action. Changed files only; findings become annotations
#   commitlint  — rtunk commit convention on every commit in the PR. Skipped
#                 for Dependabot PRs: its own commit messages never follow the
#                 `type[scope]: Subject` convention; the dependabot-auto-merge
#                 workflow sets a compliant subject on the merge commit, and on
#                 push only that merge commit (--last) is validated, since the
#                 PR's own commits were already checked (or exempted) above.
#   build       — rtunk binary
#   test        — unit tests with the race detector + a coverage floor, and the
#                 release-notes generator's tests (scripts/)
#
# Every job calls a task defined in .mise.toml, so `mise run ci` locally is the
# same gate (minus commit messages).
# =============================================================================

name: PR, Merge-Queue & Main Quality Gate

on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # lint — golangci-lint
  # ---------------------------------------------------------------------------
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restores/saves the mise cache under one key shared by every job; the key hashes the mise
      # config files, including mise.lock, so it changes only when a tool version changes.
      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🔍 Run golangci-lint
        run: mise run lint

  # ---------------------------------------------------------------------------
  # rtunk — dogfood: rtunk checks this repository through its own action
  # ---------------------------------------------------------------------------
  rtunk:
    name: 🧹 rtunk
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history: changed-since-base needs the base commit of the PR / merge-queue entry / push.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # version: source builds rtunk from this very checkout, so a PR is linted by its own code.
      - name: 🧹 Run rtunk check
        uses: ./
        with:
          version: source
          check-mode: changed-since-base

  # ---------------------------------------------------------------------------
  # commitlint — every commit must follow the rtunk commit convention
  # ---------------------------------------------------------------------------
  commitlint:
    name: ✉️ Commit Messages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Full history is needed to compare base..head SHA range.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: ✅ Validate commit messages
        if: github.event_name != 'push' && github.actor != 'dependabot[bot]'
        run: |
          mise run commitlint -- \
            --from ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }} \
            --to   ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: ✅ Validate commit messages (push to main)
        if: github.event_name == 'push'
        run: mise run commitlint -- --last

  # ---------------------------------------------------------------------------
  # build — rtunk binary
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🏗️ Build rtunk
        run: mise run build

  # ---------------------------------------------------------------------------
  # test — unit tests (race detector) + minimum coverage floor
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🧪 Run tests and enforce minimum coverage
        run: mise run coverage

      - name: 🧪 Run release tooling tests
        run: mise run test:scripts
