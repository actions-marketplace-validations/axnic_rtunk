# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Release — create a versioned release from the GitHub UI
# =============================================================================
# Triggered manually via Actions → Release → Run workflow.
#
# What it does:
#   1. Computes the next version automatically from the last git tag
#   2. Runs lint + tests (`mise run ci`) on the commit about to be released
#   3. Generates the release notes: a deterministic draft built from the commits
#      since the previous tag and their pull requests, then polished by an LLM
#      through OpenRouter (deterministic draft + LLM polish)
#   4. Creates and pushes the v<version> git tag
#   5. Builds rtunk for darwin/linux (amd64+arm64) with goreleaser and
#      publishes the archives + checksums + release notes as a draft GitHub
#      Release (prerelease for RC); the version is injected via -X main.version
#      (see .goreleaser.yml)
#
# Bump types:
#   patch / minor / major          → stable release computed from the last stable tag
#   rc-patch / rc-minor / rc-major → release candidate; increments the RC
#                                    counter if one already exists for the target
#
# Version override:
#   Setting `version` (e.g. 0.13.0 or 0.13.0-rc.1, no leading "v") releases exactly that
#   version and ignores `bump`. Use it when the computed bump can't express the wanted version,
#   e.g. for the first tag of a repo whose milestones are already numbered (v0.13.0).
#
# Release note scope:
#   RC     → commits since the last tag (RC or stable)
#   stable → commits since the last stable (non-RC) tag, so RC commits are
#            included in the final release summary
#
# Release notes:
#   Stage 0 — if the `notes` input is set, it is used as-is and nothing is generated.
#   Stage 1 — scripts/generate-release-notes.mjs writes the deterministic draft
#             (also the fallback).
#   Stage 2 — the OpenRouter model env.OPENROUTER_MODEL rewrites the draft's summary
#             placeholder, using .agents/skills/release-notes/SKILL.md as its prompt.
#   Stage 3 — if the OPENROUTER_API_KEY secret is missing, or the call or its output is
#             unusable, the deterministic draft is used as-is: notes never block a release.
#   The commit log and PR descriptions are only data for the model; its output is plain
#   Markdown that is never executed.
#
# Prerequisites:
#   • OPENROUTER_API_KEY secret (optional): without it the notes stay deterministic.
#
# The release is created as a draft so its notes can be reviewed before
# publishing. The tag is pushed with GITHUB_TOKEN, which never triggers other
# workflows, so goreleaser runs in this same workflow rather than on a
# tag-push trigger.
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - rc-patch
          - rc-minor
          - rc-major
      version:
        description: Exact version to release, without the leading "v" (overrides bump; e.g. 0.13.0)
        required: false
        type: string
      notes:
        description: Release notes override (leave blank to auto-generate)
        required: false
        type: string

# Minimal top-level permissions — the job declares what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # release — version, verify, tag, build and publish
  # ---------------------------------------------------------------------------
  release:
    name: 🚀 Create release (${{ inputs.version || inputs.bump }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # resolves the PR behind each commit for the release notes
    env:
      # Cheap, fast model that follows a strict Markdown template; the task is a short summary of
      # a few KB of commit text, so a release costs a fraction of a cent. Any OpenRouter model id.
      OPENROUTER_MODEL: deepseek/deepseek-v4-flash

    steps:
      # Full history is needed for tag computation and the release notes' commit range.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      # ── Compute next version ───────────────────────────────────────────────
      - name: 🔖 Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          # All semver-style tags, newest first
          ALL_TAGS=$(git tag -l 'v[0-9]*' --sort=-version:refname)

          # Last stable tag (no -rc. suffix); last tag of any kind
          LAST_STABLE=$(printf '%s\n' "$ALL_TAGS" | grep -v -- '-rc\.' | head -1)
          LAST_TAG=$(printf '%s\n' "$ALL_TAGS" | head -1)
          [[ -z "$LAST_STABLE" ]] && LAST_STABLE="v0.0.0"
          [[ -z "$LAST_TAG" ]]    && LAST_TAG="v0.0.0"

          VER="${LAST_STABLE#v}"
          MAJOR="${VER%%.*}"; REST="${VER#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

          # Next RC version for a given target (e.g. "1.3.0"): increments the
          # existing RC counter if an RC for that target exists, else rc.1.
          compute_rc() {
            local target="$1" existing n
            existing=$(printf '%s\n' "$ALL_TAGS" | grep "^v${target}-rc\." | head -1)
            if [[ -n "$existing" ]]; then
              n=$(printf '%s' "$existing" | grep -oE '[0-9]+$')
              printf '%s-rc.%d' "$target" "$((n + 1))"
            else
              printf '%s-rc.1' "$target"
            fi
          }

          if [[ -n "$VERSION_OVERRIDE" ]]; then
            # Explicit version: validate it and make sure it is new.
            if [[ ! "$VERSION_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
              echo "::error::Invalid version '${VERSION_OVERRIDE}' (expected X.Y.Z or X.Y.Z-rc.N, no leading v)"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v${VERSION_OVERRIDE}" >/dev/null; then
              echo "::error::Tag v${VERSION_OVERRIDE} already exists"
              exit 1
            fi
            NEW_VER="$VERSION_OVERRIDE"
            if [[ "$NEW_VER" == *-rc.* ]]; then PREV_TAG="$LAST_TAG"; else PREV_TAG="$LAST_STABLE"; fi
          else
            case "$BUMP" in
              patch)    NEW_VER="${MAJOR}.${MINOR}.$((PATCH + 1))"                ; PREV_TAG="$LAST_STABLE" ;;
              minor)    NEW_VER="${MAJOR}.$((MINOR + 1)).0"                       ; PREV_TAG="$LAST_STABLE" ;;
              major)    NEW_VER="$((MAJOR + 1)).0.0"                              ; PREV_TAG="$LAST_STABLE" ;;
              rc-patch) NEW_VER=$(compute_rc "${MAJOR}.${MINOR}.$((PATCH + 1))") ; PREV_TAG="$LAST_TAG" ;;
              rc-minor) NEW_VER=$(compute_rc "${MAJOR}.$((MINOR + 1)).0")         ; PREV_TAG="$LAST_TAG" ;;
              rc-major) NEW_VER=$(compute_rc "$((MAJOR + 1)).0.0")                ; PREV_TAG="$LAST_TAG" ;;
            esac
          fi

          { echo "version=${NEW_VER}"; echo "prev_tag=${PREV_TAG}"; } >> "$GITHUB_OUTPUT"
          echo "::notice::New version: v${NEW_VER}"
          echo "::notice::Release notes from: ${PREV_TAG}"

      # ── Verify ─────────────────────────────────────────────────────────────
      - name: 🧪 Lint and test
        run: mise run ci

      # ── Release notes ──────────────────────────────────────────────────────
      # Everything lives in $RUNNER_TEMP: goreleaser refuses to release from a dirty tree, so
      # nothing may be left untracked in the checkout.
      - name: 📋 Collect commit log for release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          PREV="${{ steps.version.outputs.prev_tag }}"
          RANGE="${PREV}..HEAD"
          [[ "$PREV" == "v0.0.0" ]] && RANGE="HEAD"

          # --first-parent: one entry per merged PR. Fields are separated by ASCII unit-separator
          # (0x1F) and records by record-separator (0x1E) to survive arbitrary commit text.
          git log --no-show-signature --first-parent \
            --format="%H%x1f%s%x1f%b%x1f%an%x1f%ae%x1e" \
            "$RANGE" > "$RUNNER_TEMP/release/git-commits.txt"

          echo "::notice::Collected $(git log --first-parent --oneline "$RANGE" | wc -l | tr -d ' ') commit(s) (${RANGE})"

      # Writes pr-data.json: { "<sha>": { number, url, login, title, body } | null }
      - name: 🔗 Resolve pull requests behind the commits
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const dir = `${process.env.RUNNER_TEMP}/release`;
            const raw = fs.readFileSync(`${dir}/git-commits.txt`, 'utf8');
            const shas = raw
              .split('\x1e')
              .filter(r => r.trim())
              .map(r => r.split('\x1f')[0].trim())
              .filter(sha => sha.length === 40);

            const results = {};
            await Promise.all(shas.map(async sha => {
              try {
                const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  commit_sha: sha,
                });
                const merged = data.find(p => p.merged_at);
                results[sha] = merged
                  ? {
                      number: merged.number,
                      url: merged.html_url,
                      login: merged.user?.login ?? null,
                      title: merged.title,
                      body: merged.body ?? '',
                    }
                  : null;
              } catch {
                results[sha] = null;
              }
            }));

            fs.writeFileSync(`${dir}/pr-data.json`, JSON.stringify(results));
            core.info(`Resolved PR data for ${shas.length} commit(s).`);

      - name: 📝 Generate deterministic release notes draft
        if: inputs.notes == ''
        run: |
          node scripts/generate-release-notes.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --commits-file "$RUNNER_TEMP/release/git-commits.txt" \
            --prs-file "$RUNNER_TEMP/release/pr-data.json" \
            --repo "${{ github.repository }}" \
            --prev-tag "${{ steps.version.outputs.prev_tag }}" \
            --output "$RUNNER_TEMP/release/notes-draft.md" \
            --context-output "$RUNNER_TEMP/release/llm-context.md"

      # The draft is copied to release-notes.md first and only replaced when the model returns
      # something usable, so every failure path ends with the deterministic notes.
      - name: 🧠 Polish release notes via OpenRouter
        if: inputs.notes == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          DIR="$RUNNER_TEMP/release"
          cp "$DIR/notes-draft.md" "$DIR/release-notes.md"

          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "::notice::OPENROUTER_API_KEY is not set - using the deterministic release notes."
            exit 0
          fi

          # The SKILL file minus its YAML frontmatter is the system prompt.
          SYSTEM=$(awk '/^---$/{n++; next} n>=2' .agents/skills/release-notes/SKILL.md)
          PROMPT="Generate the release notes for v${VERSION} (previous tag: ${PREV_TAG}).

          ## Commit log

          $(cat "$DIR/llm-context.md")

          ## Deterministic draft to improve

          $(cat "$DIR/notes-draft.md")"

          jq -n --arg model "$OPENROUTER_MODEL" --arg system "$SYSTEM" --arg user "$PROMPT" '{
            model: $model,
            temperature: 0.2,
            max_tokens: 2000,
            reasoning: { enabled: false },
            messages: [
              { role: "system", content: $system },
              { role: "user",   content: $user }
            ]
          }' > "$DIR/payload.json"

          BODY=""
          for attempt in 1 2 3; do
            if curl -sS --fail-with-body --max-time 120 \
                 https://openrouter.ai/api/v1/chat/completions \
                 -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                 -H "Content-Type: application/json" \
                 -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
                 -H "X-Title: rtunk release notes" \
                 -d @"$DIR/payload.json" -o "$DIR/response.json"; then
              # Drop a Markdown fence the model may have wrapped its answer in.
              BODY=$(jq -r '.choices[0].message.content // empty' "$DIR/response.json" \
                | sed -e '1{/^```/d}' -e '${/^```$/d}')
              [[ -n "$BODY" ]] && break
            fi
            echo "::warning::OpenRouter attempt ${attempt}/3 failed or returned nothing."
            [[ $attempt -lt 3 ]] && sleep 5
          done

          if [[ -z "$BODY" ]]; then
            echo "::warning::OpenRouter gave no usable answer - using the deterministic release notes."
          elif ! grep -q "^## What's new in v${VERSION}" <<<"$BODY" || grep -q "SUMMARY_PLACEHOLDER" <<<"$BODY"; then
            echo "::warning::OpenRouter output does not match the expected format - using the deterministic release notes."
          else
            printf '%s\n\n---\n\n<sup>Release notes polished by %s via [OpenRouter](https://openrouter.ai)</sup>\n' \
              "$BODY" "$OPENROUTER_MODEL" > "$DIR/release-notes.md"
            echo "::notice::Release notes polished by ${OPENROUTER_MODEL}."
          fi

      - name: 📋 Use manual release notes override
        if: inputs.notes != ''
        env:
          NOTES_OVERRIDE: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES_OVERRIDE" > "$RUNNER_TEMP/release/release-notes.md"

      # ── Tag ────────────────────────────────────────────────────────────────
      - name: 🔧 Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🏷️ Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # ── Build and publish ──────────────────────────────────────────────────
      - name: 🚀 Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
