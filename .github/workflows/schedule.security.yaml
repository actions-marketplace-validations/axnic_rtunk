# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Security — daily supply-chain and vulnerability scans
# =============================================================================
# Three independent checks run every day at 06:00 UTC:
#
#   govulncheck — known CVEs in Go dependencies
#   codeql      — GitHub's SAST engine for Go
#   scorecard   — OpenSSF Scorecard (supply-chain hygiene score)
#
# Can also be triggered manually for on-demand scans.
# CodeQL and Scorecard findings are surfaced in the repository's Security tab.
# =============================================================================

name: Security

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: 0 6 * * *
  workflow_dispatch: {}

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # govulncheck — known vulnerabilities in Go dependencies
  # ---------------------------------------------------------------------------
  govulncheck:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: go go:golang.org/x/vuln/cmd/govulncheck

      - name: 🔍 Run govulncheck
        run: mise run vulncheck

  # ---------------------------------------------------------------------------
  # codeql — Static Application Security Testing (SAST)
  # ---------------------------------------------------------------------------
  codeql:
    name: 🧬 CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          languages: go
          queries: security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3

      - name: 🔍 Run CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          category: /language:go

  # ---------------------------------------------------------------------------
  # scorecard — OpenSSF supply-chain security score
  # ---------------------------------------------------------------------------
  scorecard:
    name: 🏆 OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      # Required by scorecard to read repo metadata.
      actions: read
      contents: read
      # Required to publish results to the Security tab.
      security-events: write
      # Required for scorecard to sign the attestation.
      id-token: write

    steps:
      # Do not persist credentials — scorecard best practice.
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📊 Run OpenSSF Scorecard
        uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # publish_results enables the Scorecard badge and trending data.
          publish_results: true

      - name: 📤 Upload results to Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
