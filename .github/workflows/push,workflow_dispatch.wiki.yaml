# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Wiki — publish docs/ to the GitHub Wiki
# =============================================================================
# Triggered on every push to main that touches docs/ (or this workflow), or
# manually via workflow_dispatch. docs/ is mirrored as-is to the wiki repo.
# =============================================================================

name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/push,workflow_dispatch.wiki.yaml
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

# Minimal top-level permissions — the job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # publish — mirror docs/ to the wiki
  # ---------------------------------------------------------------------------
  publish:
    name: 📚 Publish wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📤 Publish docs/ to the wiki
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          path: docs
          disable-empty-commits: true
