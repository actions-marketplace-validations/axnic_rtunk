# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# MANAGED BY TERRAFORM (axnic/.github-private, modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/wiki.publish.yaml

name: Wiki

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/push,workflow_dispatch.wiki.yaml
  workflow_dispatch: {}

concurrency:
  group: wiki
  cancel-in-progress: false

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  wiki:
    name: 📚 Publish Wiki
    # Intentionally not pinned: follows the latest axnic/.github (owner-controlled repo).
    uses: axnic/.github/.github/workflows/wiki.publish.yaml@main
    secrets: inherit
    permissions:
      contents: write
    with:
      docs-dir: "docs"
