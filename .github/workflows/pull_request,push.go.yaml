# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# Go — Build and tests
# =============================================================================
# Runs only when Go code changes: Go sources, go.mod/go.sum, or this workflow. Not run for
# merge-queue entries: the pull request already passed it.
# Lint, rtunk and commit messages are checked by merge_group,pull_request,push.lint.yaml
# on every change.
#
#   build       — rtunk binary
#   test        — unit tests with the race detector + a coverage floor on Linux and
#                 macOS, and the release-notes generator's tests (scripts/, Linux)
#
# Every job calls a `ci:*` task defined in .mise.toml, so `mise run ci` locally is
# the same gate.
#
# =============================================================================

name: Go

on:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/pull_request,push.go.yaml
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/pull_request,push.go.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # build — rtunk binary
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🏗️ Build rtunk
        run: mise run ci:build

  # ---------------------------------------------------------------------------
  # test — unit tests (race detector) + minimum coverage floor
  # ---------------------------------------------------------------------------
  test:
    name: 🧪 Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux and macOS (rtunk ships to both: ioctl terminal size, ~/Library/Caches). Every leg runs to
    # completion so one platform's failure does not hide the other's.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install tools via mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          cache: true
          cache_key: "mise-v1-{{platform}}-{{file_hash}}"

      - name: 🧪 Run tests and enforce minimum coverage
        run: mise run ci:coverage

      # Platform-independent Node scripts: one run (Linux) is enough.
      - name: 🧪 Run release tooling tests
        if: runner.os == 'Linux'
        run: mise run ci:scripts
