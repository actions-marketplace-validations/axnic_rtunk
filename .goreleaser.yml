version: 2
project_name: rtunk
builds:
  - id: rtunk
    main: ./cmd/rtunk
    binary: rtunk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w
      - -X main.version={{.Tag}}
archives:
  - id: archive
    name_template: "{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
# SPDX SBOM (<archive>.sbom.json) per archive, generated by syft (installed through mise).
sboms:
  - artifacts: archive
# Keyless cosign signature of checksums.txt (which covers every archive), issued to the Release
# workflow's OIDC identity and logged in Rekor. The bundle holds signature + certificate.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, "--bundle=${signature}", "${artifact}"]
    output: true
snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"
# Only used when goreleaser runs standalone: the central release workflow passes its own notes with
# --release-notes, which replaces this changelog.
changelog:
  use: github
release:
  disable: false
  # Draft so the generated notes can be reviewed before publishing.
  draft: true
  # Tags with a semver prerelease segment (e.g. v1.0.0-rc.1) are marked as GitHub prereleases
  # automatically - one config handles both cases.
  prerelease: auto
